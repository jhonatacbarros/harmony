<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmony - Assistir Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    /* Animação suave para controles */
    .controls-fade {
      transition: opacity 0.3s ease-in-out;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

  <!-- Top Bar -->
  <header id="topBar" class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between p-4 bg-gradient-to-b from-black/80 to-transparent transition-opacity duration-300">
    <div class="flex items-center gap-3">
      <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 font-bold text-white shadow-md">
        H
      </div>
      <div>
        <h1 class="text-sm font-bold text-white">Harmony Live</h1>
        <p class="text-[10px] text-slate-400">Transmissão em Tempo Real</p>
      </div>
    </div>

    <!-- Status Badges -->
    <div class="flex items-center gap-2">
      <div id="statusBadge" class="flex items-center gap-1.5 rounded-full bg-slate-800/80 border border-slate-700 px-3 py-1 text-xs font-semibold text-slate-300 backdrop-blur-md">
        <span id="statusDot" class="h-2 w-2 rounded-full bg-slate-500"></span>
        <span id="statusText">Conectando...</span>
      </div>

      <button id="fullscreenBtn" class="flex items-center justify-center p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-white backdrop-blur-md transition-colors" title="Tela Cheia">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Video Container -->
  <main id="videoContainer" class="relative flex-1 flex items-center justify-center bg-black">
    <video
      id="remoteVideo"
      autoplay
      playsinline
      class="max-w-full max-h-full w-full h-full object-contain"
    ></video>

    <!-- Overlay: Click to Unmute Audio -->
    <div id="unmuteOverlay" class="absolute inset-0 bg-black/60 backdrop-blur-xs flex flex-col items-center justify-center z-20 cursor-pointer hidden">
      <div class="p-4 rounded-full bg-indigo-600/90 text-white shadow-2xl animate-bounce mb-3">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
      </div>
      <p class="text-sm font-semibold text-white">Clique para Ativar o Áudio</p>
      <p class="text-xs text-slate-400 mt-1">O navegador bloqueia o som automático</p>
    </div>

    <!-- Overlay: Stream Paused -->
    <div id="pausedOverlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center z-10 hidden">
      <div class="text-amber-400 mb-3 animate-pulse">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h2 class="text-lg font-bold text-white uppercase tracking-wider">Transmissão Pausada</h2>
      <p class="text-xs text-slate-400 mt-1">O streamer pausou o vídeo momentaneamente.</p>
    </div>

    <!-- Overlay: PIN Request Modal -->
    <div id="pinModal" class="absolute inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-40 hidden">
      <div class="w-full max-w-sm p-6 rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl text-center">
        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600/20 text-indigo-400 mb-4 border border-indigo-500/30">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h3 class="text-base font-bold text-white mb-1">Transmissão Protegida</h3>
        <p class="text-xs text-slate-400 mb-4">Insira o PIN fornecido pelo streamer para assistir.</p>
        
        <input
          type="password"
          id="pinInput"
          placeholder="Digite o PIN"
          class="w-full text-center tracking-widest text-lg font-mono rounded-xl border border-slate-700 bg-slate-950 px-4 py-2.5 text-white focus:border-indigo-500 focus:outline-none mb-3"
        />
        <p id="pinError" class="text-xs text-red-400 mb-3 hidden">PIN incorreto. Tente novamente.</p>

        <button
          id="submitPinBtn"
          class="w-full rounded-xl bg-indigo-600 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500 shadow-lg shadow-indigo-600/30 transition-all"
        >
          Entrar na Live
        </button>
      </div>
    </div>
  </main>

  <script>
    const ICE_SERVERS = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' }
      ]
    };

    const remoteVideo = document.getElementById('remoteVideo');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const statusBadge = document.getElementById('statusBadge');
    const pausedOverlay = document.getElementById('pausedOverlay');
    const unmuteOverlay = document.getElementById('unmuteOverlay');
    const pinModal = document.getElementById('pinModal');
    const pinInput = document.getElementById('pinInput');
    const pinError = document.getElementById('pinError');
    const submitPinBtn = document.getElementById('submitPinBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    let pc = null;
    let ws = null;
    let viewerId = 'viewer_' + Math.random().toString(36).substr(2, 9);
    let enteredPin = '';

    function updateStatus(state, message) {
      statusText.innerText = message;
      if (state === 'live') {
        statusDot.className = 'h-2 w-2 rounded-full bg-red-500 animate-ping';
        statusBadge.className = 'flex items-center gap-1.5 rounded-full bg-red-500/10 border border-red-500/30 px-3 py-1 text-xs font-semibold text-red-400 backdrop-blur-md';
      } else if (state === 'paused') {
        statusDot.className = 'h-2 w-2 rounded-full bg-amber-400';
        statusBadge.className = 'flex items-center gap-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 px-3 py-1 text-xs font-semibold text-amber-400 backdrop-blur-md';
      } else {
        statusDot.className = 'h-2 w-2 rounded-full bg-slate-500';
        statusBadge.className = 'flex items-center gap-1.5 rounded-full bg-slate-800/80 border border-slate-700 px-3 py-1 text-xs font-semibold text-slate-300 backdrop-blur-md';
      }
    }

    async function startWebRTC() {
      pc = new RTCPeerConnection(ICE_SERVERS);

      pc.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
          updateStatus('live', 'AO VIVO');

          // Attempt autoplay with audio
          remoteVideo.play().catch(() => {
            // Autoplay blocked by browser policy: show unmute overlay
            unmuteOverlay.classList.remove('hidden');
          });
        }
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'candidate',
            senderId: viewerId,
            payload: event.candidate
          }));
        }
      };

      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'offer',
          senderId: viewerId,
          pin: enteredPin,
          payload: offer
        }));
      }
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/viewer?id=${viewerId}&pin=${encodeURIComponent(enteredPin)}`;
      
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        updateStatus('connecting', 'Negociando P2P...');
        startWebRTC();
      };

      ws.onmessage = async (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === 'pin_required') {
            pinModal.classList.remove('hidden');
            if (msg.error) pinError.classList.remove('hidden');
            return;
          }

          if (msg.type === 'answer' && msg.payload) {
            await pc.setRemoteDescription(new RTCSessionDescription(msg.payload));
          } else if (msg.type === 'candidate' && msg.payload) {
            await pc.addIceCandidate(new RTCIceCandidate(msg.payload));
          } else if (msg.type === 'status') {
            if (msg.payload === 'paused') {
              pausedOverlay.classList.remove('hidden');
              updateStatus('paused', 'PAUSADO');
            } else if (msg.payload === 'live') {
              pausedOverlay.classList.add('hidden');
              updateStatus('live', 'AO VIVO');
            }
          }
        } catch (e) {
          console.error("Error processing WS message:", e);
        }
      };

      ws.onclose = () => {
        updateStatus('closed', 'Desconectado');
        setTimeout(connectWebSocket, 3000); // Tenta reconectar após 3s
      };
    }

    // Submit PIN
    submitPinBtn.addEventListener('click', () => {
      enteredPin = pinInput.value.trim();
      pinModal.classList.add('hidden');
      if (ws) ws.close();
      connectWebSocket();
    });

    // Unmute overlay click
    unmuteOverlay.addEventListener('click', () => {
      remoteVideo.muted = false;
      remoteVideo.play();
      unmuteOverlay.classList.add('hidden');
    });

    // Fullscreen Toggle
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    // Start connection
    connectWebSocket();
  </script>
</body>
</html>
